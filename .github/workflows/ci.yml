name: CI

on:
  push:
    branches: [main, arena/**, feature/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agencyos
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}
          POSTGRES_DB: agencyos
        options: >-
          --health-cmd "pg_isready -U agencyos -d agencyos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agencyos
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}
          POSTGRES_DB: agencyos
        options: >-
          --health-cmd "pg_isready -U agencyos -d agencyos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      - run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U agencyos -d agencyos; then
              echo "Database is ready"
              break
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done
      - run: node_modules/.bin/prisma generate
        env:
          CHECKPOINT_DISABLE: "1"
          PRISMA_HIDE_UPDATE_MESSAGE: "true"
          DATABASE_URL: "postgresql://agencyos:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}@localhost:5432/agencyos?schema=public"
      - run: node_modules/.bin/prisma validate
        env:
          CHECKPOINT_DISABLE: "1"
          PRISMA_HIDE_UPDATE_MESSAGE: "true"
          DATABASE_URL: "postgresql://agencyos:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}@localhost:5432/agencyos?schema=public" 
      - run: set -o pipefail && node_modules/.bin/prisma migrate deploy 2>&1
        env:
          CHECKPOINT_DISABLE: "1"
          PRISMA_HIDE_UPDATE_MESSAGE: "true"
          DATABASE_URL: "postgresql://agencyos:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}@localhost:5432/agencyos?schema=public"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: prisma-migrate-log
          path: prisma-migrate.log
      - run: |
          npm run build &
          BUILD_PID=$!
          wait $BUILD_PID
          if [ $? -ne 0 ]; then
            echo "ERROR: Next.js build failed" >&2
            exit 1
          fi
          npm start &
          SERVER_PID=$!
          SERVER_READY=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/auth/get-session > /dev/null 2>&1; then
              echo "Next.js server is ready"
              SERVER_READY=1
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          if [ "$SERVER_READY" -ne 1 ]; then
            echo "ERROR: Next.js server did not become ready within 60 seconds" >&2
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          set -o pipefail && npm test 2>&1 | tee test-output.log
          TEST_EXIT=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $TEST_EXIT
        env:
          DATABASE_URL: "postgresql://agencyos:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}@localhost:5432/agencyos?schema=public"
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci_auth_secret_arena_2026' }}
          BETTER_AUTH_URL: "http://localhost:3001"
          TEST_SERVER_URL: "http://localhost:3001"
          NODE_ENV: "test"
          PORT: "3001"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-output-log
          path: test-output.log

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
        env:
          DATABASE_URL: "postgresql://agencyos:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}@localhost:5432/agencyos?schema=public"
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci_auth_secret_arena_2026' }}
          BETTER_AUTH_URL: "http://localhost:3001"
