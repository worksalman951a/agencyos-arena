name: CI

on:
  push:
    branches: [main, arena/**, feature/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agencyos
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}
          POSTGRES_DB: agencyos
        options: >-
          --health-cmd "pg_isready -U agencyos -d agencyos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      # Generate the Prisma client before typechecking: without it @prisma/client
      # resolves to a missing module and skipLibCheck silently makes every
      # Prisma call `any`, which hides schema/code drift from tsc.
      - run: node_modules/.bin/prisma generate
        env:
          CHECKPOINT_DISABLE: '1'
          PRISMA_HIDE_UPDATE_MESSAGE: 'true'
      - run: npx tsc --noEmit
      # Prisma client is typed `any` in lib/db.ts, so tsc cannot catch writes to
      # columns that do not exist. This guard statically compares every Prisma
      # write payload against prisma/schema.prisma.
      - run: npm run check:schema

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agencyos
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}
          POSTGRES_DB: agencyos
        options: >-
          --health-cmd "pg_isready -U agencyos -d agencyos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U agencyos -d agencyos; then
              echo "Database is ready"
              break
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done
      - run: node_modules/.bin/prisma generate
        env:
          CHECKPOINT_DISABLE: '1'
          PRISMA_HIDE_UPDATE_MESSAGE: 'true'
          DATABASE_URL: "postgresql://agencyos:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}@localhost:5432/agencyos?schema=public"
      - run: node_modules/.bin/prisma validate
        env:
          CHECKPOINT_DISABLE: '1'
          PRISMA_HIDE_UPDATE_MESSAGE: 'true'
          DATABASE_URL: "postgresql://agencyos:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}@localhost:5432/agencyos?schema=public"
      - run: set -o pipefail && node_modules/.bin/prisma migrate deploy 2>&1
        env:
          CHECKPOINT_DISABLE: '1'
          PRISMA_HIDE_UPDATE_MESSAGE: 'true'
          DATABASE_URL: "postgresql://agencyos:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}@localhost:5432/agencyos?schema=public"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: prisma-migrate-log
          path: prisma-migrate.log
      - run: |
          npm run build > build-output.log 2>&1 &
          BUILD_PID=$!
          wait $BUILD_PID
          BUILD_EXIT=$?
          tail -n 80 build-output.log
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "ERROR: Next.js build failed" >&2
            exit 1
          fi
          npm start > server-output.log 2>&1 &
          SERVER_PID=$!
          SERVER_READY=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/auth/get-session > /dev/null 2>&1; then
              echo "Next.js server is ready"
              SERVER_READY=1
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          if [ "$SERVER_READY" -ne 1 ]; then
            echo "ERROR: Next.js server did not become ready within 60 seconds" >&2
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          set -o pipefail && npm run test:unit 2>&1 | tee unit-test-output.log
          UNIT_EXIT=$?
          set -o pipefail && npm run test:integration 2>&1 | tee integration-test-output.log
          INTEGRATION_EXIT=$?
          kill $SERVER_PID 2>/dev/null || true
          if [ "$UNIT_EXIT" -ne 0 ] || [ "$INTEGRATION_EXIT" -ne 0 ]; then
            echo "ERROR: tests failed (unit=$UNIT_EXIT integration=$INTEGRATION_EXIT)" >&2
            exit 1
          fi
        env:
          DATABASE_URL: "postgresql://agencyos:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}@localhost:5432/agencyos?schema=public"
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci_auth_secret_arena_2026' }}
          BETTER_AUTH_URL: 'http://localhost:3001'
          TEST_SERVER_URL: 'http://localhost:3001'
          NODE_ENV: 'test'
          PORT: '3001'
          # The integration runner drives hundreds of requests from 127.0.0.1.
          # Trusting the forwarding header here (the runner is the only client,
          # and it is what sets the header) lets each suite claim its own
          # private bucket and exercise the per-address limits without
          # exhausting the shared one. Production does not set this unless a
          # real trusted proxy rewrites the header.
          TRUST_PROXY_HEADERS: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-output-logs
          path: |
            unit-test-output.log
            integration-test-output.log
          if-no-files-found: ignore
      # Logs and artifacts live on a storage host that is not reachable from
      # every environment; annotations are always available through the API, so
      # the interesting failure lines are surfaced here as well.
      - name: Surfaces test failures as annotations
        if: failure()
        run: |
          echo "## Test failure details" >> "$GITHUB_STEP_SUMMARY"
          for f in build-output.log server-output.log unit-test-output.log integration-test-output.log; do
            [ -f "$f" ] || continue
            {
              echo ""
              echo "### $f"
              echo '```'
              grep -aE "FAIL |AssertionError|Expected|Received|❯ |Test Files|Tests +[0-9]|Error:" "$f" | sed -e 's/\x1b\[[0-9;]*m//g' | tail -120
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          for f in build-output.log server-output.log unit-test-output.log integration-test-output.log; do
            [ -f "$f" ] || continue
            tail -n 40 "$f" | sed -e 's/\x1b\[[0-9;]*m//g' | tr '\n' '|' | head -c 5000 > /tmp/tail.txt || true
            echo "::error file=.github/workflows/ci.yml,title=tail $f::$(cat /tmp/tail.txt)"
          done

  e2e:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agencyos
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}
          POSTGRES_DB: agencyos
        options: >-
          --health-cmd "pg_isready -U agencyos -d agencyos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U agencyos -d agencyos; then
              echo "Database is ready"
              break
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done
      - run: node_modules/.bin/prisma generate
        env:
          CHECKPOINT_DISABLE: '1'
          PRISMA_HIDE_UPDATE_MESSAGE: 'true'
          DATABASE_URL: "postgresql://agencyos:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}@localhost:5432/agencyos?schema=public"
      - run: node_modules/.bin/prisma migrate deploy
        env:
          CHECKPOINT_DISABLE: '1'
          PRISMA_HIDE_UPDATE_MESSAGE: 'true'
          DATABASE_URL: "postgresql://agencyos:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}@localhost:5432/agencyos?schema=public"
      - name: Record Playwright runner and browser metadata
        run: |
          {
            echo "--- Runner OS ---"
            cat /etc/os-release
            echo "--- Node and package versions ---"
            node --version
            npm --version
            node - <<'NODE'
          for (const name of ['@playwright/test', 'playwright', 'playwright-core']) {
            try {
              const pkg = require(`./node_modules/${name}/package.json`);
              console.log(`${name}: ${pkg.version}`);
            } catch (error) {
              console.log(`${name}: unavailable (${error.message})`);
            }
          }
          const browserData = require('./node_modules/playwright-core/browsers.json');
          console.log('managed Chromium:', browserData.browsers.filter(({ name }) => name.startsWith('chromium')));
          NODE
          } 2>&1 | tee playwright-runner-info.log
      - name: Install Playwright Chromium and system dependencies
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium 2>&1 | tee playwright-install.log
      - run: npm run build
        env:
          DATABASE_URL: "postgresql://agencyos:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}@localhost:5432/agencyos?schema=public"
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci_auth_secret_arena_2026' }}
          BETTER_AUTH_URL: 'http://localhost:3001'
      - name: Run Playwright against an isolated test database
        run: |
          npm start > e2e-server-output.log 2>&1 &
          SERVER_PID=$!
          SERVER_READY=0
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3001/api/auth/get-session > /dev/null 2>&1; then
              echo "Next.js server is ready"
              SERVER_READY=1
              break
            fi
            echo "Waiting for server... ($i/40)"
            sleep 2
          done
          if [ "$SERVER_READY" -ne 1 ]; then
            echo "ERROR: Next.js server did not become ready" >&2
            tail -n 80 e2e-server-output.log
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          set -o pipefail && npx playwright test --add-reporter=json 2>&1 | tee e2e-output.log
          E2E_EXIT=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $E2E_EXIT
        env:
          DATABASE_URL: "postgresql://agencyos:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}@localhost:5432/agencyos?schema=public"
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci_auth_secret_arena_2026' }}
          BETTER_AUTH_URL: 'http://localhost:3001'
          APP_URL: 'http://localhost:3001'
          TEST_SERVER_URL: 'http://localhost:3001'
          PLAYWRIGHT_SKIP_WEBSERVER: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: 'playwright-results.json'
          CI: 'true'
          PORT: '3001'
      - name: Report exact Playwright result counts
        if: always()
        run: |
          if [ ! -f playwright-results.json ]; then
            echo "Playwright did not produce a JSON report; browser tests did not start." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Playwright result counts::not run (no JSON report)"
            exit 0
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('playwright-results.json', 'utf8'));
          let retriedTests = 0;
          let retryAttempts = 0;
          const visit = (suites) => {
            for (const suite of suites ?? []) {
              for (const spec of suite.specs ?? []) {
                for (const test of spec.tests ?? []) {
                  const retries = (test.results ?? []).filter((result) => result.retry > 0).length;
                  if (retries > 0) retriedTests += 1;
                  retryAttempts += retries;
                }
              }
              visit(suite.suites);
            }
          };
          visit(report.suites);
          const stats = report.stats ?? {};
          const summary = `passed=${stats.expected ?? 0}, failed=${stats.unexpected ?? 0}, skipped=${stats.skipped ?? 0}, flaky=${stats.flaky ?? 0}, retried_tests=${retriedTests}, retry_attempts=${retryAttempts}`;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Playwright result counts\n\n${summary}\n`);
          console.log(`::notice title=Playwright result counts::${summary}`);
          NODE
      - name: Surface E2E failures
        if: failure()
        run: |
          echo "## E2E failure diagnostics" >> "$GITHUB_STEP_SUMMARY"
          for f in playwright-runner-info.log playwright-install.log e2e-output.log e2e-server-output.log; do
            [ -f "$f" ] || continue
            {
              echo ""
              echo "### $f (last 80 lines)"
              echo '```text'
              tail -n 80 "$f" | sed -e 's/\x1b\[[0-9;]*m//g'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            diagnostic=$(tail -n 50 "$f" | sed -e 's/\x1b\[[0-9;]*m//g' | tr '\n' '|' | head -c 6000)
            echo "::error file=.github/workflows/ci.yml,title=$f::$diagnostic"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            playwright-runner-info.log
            playwright-install.log
            playwright-results.json
            e2e-output.log
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          DATABASE_URL: "postgresql://agencyos:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}@localhost:5432/agencyos?schema=public"
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci_auth_secret_arena_2026' }}
          BETTER_AUTH_URL: 'http://localhost:3001'

  # Backup & restore verification (Phase 4D / Batch 3A).
  #
  # This is the only place the backup tooling is exercised end to end, because
  # a backup script can only be proved by a real PostgreSQL server. A mocked
  # `pg_dump`, a unit test of the guard functions, or `pg_restore --list`
  # showing a plausible object list would all pass on an archive that restores
  # to nothing. So this job:
  #
  #   1. migrates the service database and writes a small known fixture,
  #   2. runs scripts/backup/backup.mjs to produce a real custom-format dump,
  #   3. restores it into a NEW disposable database on a SECOND, isolated
  #      PostgreSQL service (port 5433) via scripts/backup/verify-restore.mjs,
  #   4. queries the restored copy directly for the fixture rows,
  #   5. re-runs the tooling against a corrupted archive to prove it fails.
  #
  # Two separate services matter: the restore target is a different server, so
  # a bug that accidentally wrote to the source cannot hide behind "it worked".
  # The application database itself is never restored into, reset or dropped.
  backup-verify:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agencyos
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}
          POSTGRES_DB: agencyos
        options: >-
          --health-cmd "pg_isready -U agencyos -d agencyos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      # The isolated target. A distinct container on 5433, so the restore
      # cannot reach the source database even by accident.
      postgres-restore-target:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agencyos
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U agencyos -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432
    env:
      SOURCE_URL: "postgresql://agencyos:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}@localhost:5432/agencyos?schema=public"
      TARGET_URL: "postgresql://agencyos:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}@localhost:5433/postgres"
      # The seed step uses these instead of passing a URL on the psql command
      # line, so the password never appears in the process list.
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: agencyos
      PGDATABASE: agencyos
      PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}
      PG_CLIENT_VERSION: '16'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      # pg_dump/pg_restore/psql are not on the ubuntu-latest image by default.
      # Install only the client (not a server) so the tools match the
      # postgres:16 service image.
      - name: Install PostgreSQL 16 client tools
        run: |
          # The client major must match the postgres:16 service image. A newer
          # client emits `SET transaction_timeout = 0`, which a 16 server
          # rejects, and the restore then dies while INITIALIZING.
          #
          # Neither apt route works on this runner (PGDG has no 16 series for
          # the release; the distribution repos ship 18 with no versioned 16
          # package). Copying binaries out of the image is also not enough: the
          # PGDG binaries need libpq from the same image, so `psql` exits 127
          # once run on the bare runner.
          #
          # So the tools run *inside* the image. A wrapper is written for each
          # tool, which is what every later step invokes — the PATH looks the
          # same to the scripts, and the binaries keep their own libraries.
          mkdir -p "$HOME/pg-client/bin"
          docker pull -q "postgres:${PG_CLIENT_VERSION}" > /dev/null

          write_wrapper() {
            local tool="$1"
            cat > "$HOME/pg-client/bin/$tool" <<WRAPPER
          #!/bin/bash
          # Runs the ${PG_CLIENT_VERSION} client from the official image so the
          # binary always matches the server the dump is restored into.
          # --network host so `localhost:5432` inside the container is the
          # runner's localhost, where the service ports are published.
          exec docker run --rm -i --network host \
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE \
            -e PGSSLMODE -e PGCONNECT_TIMEOUT -e PGPASSFILE \
            -v "\$PWD:\$PWD" -w "\$PWD" \
            "postgres:${PG_CLIENT_VERSION}" "$tool" "\$@"
          WRAPPER
            chmod +x "$HOME/pg-client/bin/$tool"
          }

          for tool in pg_dump pg_restore psql pg_isready createdb; do
            write_wrapper "$tool"
          done

          echo "$HOME/pg-client/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/pg-client/bin:$PATH"

          pg_dump --version
          pg_restore --version
          psql --version
          dump_major="$(pg_dump --version | sed -E 's/.* ([0-9]+)\..*/\1/')"
          restore_major="$(pg_restore --version | sed -E 's/.* ([0-9]+)\..*/\1/')"
          echo "client major: pg_dump=$dump_major pg_restore=$restore_major (server image: ${PG_CLIENT_VERSION})"
          if [ "$dump_major" != "$PG_CLIENT_VERSION" ] || [ "$restore_major" != "$PG_CLIENT_VERSION" ]; then
            echo "::error title=pg client version::need pg_dump/pg_restore major $PG_CLIENT_VERSION to match the postgres:16 service, got $dump_major/$restore_major"
            exit 1
          fi

      - name: Wait for both PostgreSQL services
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U agencyos -d agencyos \
               && pg_isready -h localhost -p 5433 -U agencyos -d postgres; then
              echo "Both services are ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          echo "ERROR: PostgreSQL services did not become ready" >&2
          exit 1

      - name: Migrate the source database
        run: node_modules/.bin/prisma migrate deploy
        env:
          CHECKPOINT_DISABLE: '1'
          PRISMA_HIDE_UPDATE_MESSAGE: 'true'
          DATABASE_URL: ${{ env.SOURCE_URL }}

      - name: Seed known fixture rows
        run: psql -w -v ON_ERROR_STOP=1 -q -f scripts/backup/ci-seed.sql

      # ---------------------------------------------------------------------
      # 1. Back up.
      # ---------------------------------------------------------------------
      - name: Create backup
        run: |
          node scripts/backup/backup.mjs --dir backup-artifacts --label "ci-${{ github.run_id }}"
          echo "--- artifacts ---"
          ls -l backup-artifacts
          echo "--- manifest ---"
          cat backup-artifacts/*.json
        env:
          DATABASE_URL: ${{ env.SOURCE_URL }}

      # A second run into the same directory must refuse, not overwrite. This is
      # the anti-clobber guarantee, checked against the real filesystem.
      - name: Backup refuses to overwrite an existing archive
        run: |
          set +e
          node scripts/backup/backup.mjs --dir backup-artifacts --output "$(ls backup-artifacts/*.dump | head -1)"
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "ERROR: expected exit 2 (refused to overwrite), got $status" >&2
            exit 1
          fi
          echo "Correctly refused to overwrite (exit 2)"
        env:
          DATABASE_URL: ${{ env.SOURCE_URL }}

      # ---------------------------------------------------------------------
      # 1b. The scheduled runner (Phase 4D / Batch 3B), against real
      #     PostgreSQL.
      #
      # The unit suite mocks the backup command, so only a real server can
      # show that the scheduled path produces a genuine archive, that
      # retention behaves on real files, and that the failure paths report
      # the documented exit codes.
      # ---------------------------------------------------------------------
      - name: Scheduled runner creates a verified backup
        run: |
          set -euo pipefail
          node scripts/backup/scheduled-backup.mjs \
            --dir scheduled-artifacts \
            --keep 3 \
            --label "ci-scheduled-${{ github.run_id }}"
          echo "--- structured result ---"
          cat scheduled-artifacts/last-run.json
          node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('scheduled-artifacts/last-run.json', 'utf8'));
          const problems = [];
          if (result.status !== 'succeeded') problems.push(`status=${result.status}`);
          if (result.backup.status !== 'succeeded') problems.push(`backup=${result.backup.status}`);
          if (!/^[0-9a-f]{64}$/.test(result.backup.archive?.sha256 ?? '')) problems.push('no sha256');
          if (!result.startedAt || !result.finishedAt) problems.push('missing timestamps');
          if (result.retention.status !== 'applied') problems.push(`retention=${result.retention.status}`);
          if (problems.length) {
            console.error(`::error title=scheduled backup::${problems.join(', ')}`);
            process.exit(1);
          }
          console.log(`::notice title=scheduled backup::status=${result.status} archive=${result.backup.archive.name} sha256=${result.backup.archive.sha256}`);
          NODE
        env:
          DATABASE_URL: ${{ env.SOURCE_URL }}

      - name: Scheduled runner applies retention and keeps the newest backup
        run: |
          set -euo pipefail

          # Two more archives, so the policy has something to expire.
          for i in 1 2; do
            node scripts/backup/scheduled-backup.mjs \
              --dir scheduled-artifacts --keep 3 --label "ci-retention-$i" > /dev/null
          done
          before="$(ls scheduled-artifacts/*.dump | wc -l)"
          echo "archives before retention: $before"
          [ "$before" -eq 3 ] || { echo "::error title=retention::expected 3 archives, got $before"; exit 1; }

          # A dry run must plan deletions and change nothing.
          node scripts/backup/scheduled-backup.mjs \
            --dir scheduled-artifacts --retention-only --keep 1 --dry-run > retention-dry-run.log
          after_dry="$(ls scheduled-artifacts/*.dump | wc -l)"
          [ "$after_dry" -eq "$before" ] || {
            echo "::error title=retention::the dry run changed the archive set ($before -> $after_dry)"
            exit 1
          }
          node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('scheduled-artifacts/last-run.json', 'utf8'));
          const problems = [];
          if (result.retention.status !== 'dry-run') problems.push(`status=${result.retention.status}`);
          if (!result.retention.planned.length) problems.push('nothing was planned');
          if (result.retention.deleted.length) problems.push('the dry run reported deletions');
          if (problems.length) {
            console.error(`::error title=retention::dry run: ${problems.join(', ')}`);
            process.exit(1);
          }
          NODE

          # Applying the policy must leave exactly the newest archive.
          newest_before="$(ls -t scheduled-artifacts/*.dump | head -1)"
          node scripts/backup/scheduled-backup.mjs \
            --dir scheduled-artifacts --retention-only --keep 1 > retention.log
          after="$(ls scheduled-artifacts/*.dump | wc -l)"
          [ "$after" -eq 1 ] || {
            echo "::error title=retention::expected 1 archive after retention, got $after"
            exit 1
          }
          survivor="$(ls scheduled-artifacts/*.dump | head -1)"
          if [ "$survivor" != "$newest_before" ]; then
            echo "::error title=retention::retention deleted the newest verified backup ($newest_before -> $survivor)"
            exit 1
          fi
          echo "Retention kept the newest verified backup: $survivor"
        env:
          DATABASE_URL: ${{ env.SOURCE_URL }}

      - name: Scheduled runner refuses an overlapping run
        run: |
          set -euo pipefail
          before="$(ls scheduled-artifacts/*.dump | wc -l)"
          # The shell's own PID is alive, so this lock is a live run.
          printf '{"pid": %d, "startedAt": "%s"}\n' "$$" "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            > scheduled-artifacts/.agencyos-backup.lock
          set +e
          node scripts/backup/scheduled-backup.mjs --dir scheduled-artifacts --keep 1 \
            > overlap.log 2>&1
          status=$?
          set -e
          cat overlap.log
          rm -f scheduled-artifacts/.agencyos-backup.lock
          if [ "$status" -ne 6 ]; then
            echo "::error title=scheduled backup::expected exit 6 (locked), got $status"
            exit 1
          fi
          after="$(ls scheduled-artifacts/*.dump | wc -l)"
          [ "$after" -eq "$before" ] || {
            echo "::error title=scheduled backup::the refused run changed the archive set"
            exit 1
          }
          echo "Correctly refused the overlapping run (exit 6)"
        env:
          DATABASE_URL: ${{ env.SOURCE_URL }}

      - name: A failed backup is reported and deletes nothing
        run: |
          set -euo pipefail
          before="$(ls scheduled-artifacts/*.dump | wc -l)"
          set +e
          # Port 1 is closed, so pg_dump fails: the runner must report the
          # failure and must not prune the archives it already has.
          DATABASE_URL="postgresql://agencyos:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}@localhost:1/agencyos?schema=public" \
            node scripts/backup/scheduled-backup.mjs \
              --dir scheduled-artifacts --keep 1 \
              --result-file scheduled-artifacts/failed-run.json > failed-backup.log 2>&1
          status=$?
          set -e
          cat failed-backup.log
          if [ "$status" -ne 3 ]; then
            echo "::error title=scheduled backup::expected exit 3 (tool failed), got $status"
            exit 1
          fi
          after="$(ls scheduled-artifacts/*.dump | wc -l)"
          [ "$after" -eq "$before" ] || {
            echo "::error title=scheduled backup::a failed backup changed the archive set ($before -> $after)"
            exit 1
          }
          node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('scheduled-artifacts/failed-run.json', 'utf8'));
          const problems = [];
          if (result.status !== 'failed') problems.push(`status=${result.status}`);
          if (result.backup.status !== 'failed') problems.push(`backup=${result.backup.status}`);
          if (result.backup.lastStatus !== 'failed') problems.push(`lastStatus=${result.backup.lastStatus}`);
          if (result.retention.status !== 'skipped') problems.push(`retention=${result.retention.status}`);
          if (result.retention.reason !== 'backup_failed') problems.push(`reason=${result.retention.reason}`);
          if (problems.length) {
            console.error(`::error title=scheduled backup::${problems.join(', ')}`);
            process.exit(1);
          }
          NODE
          echo "Failed backup reported as exit 3, nothing deleted"

      # ---------------------------------------------------------------------
      # 2. Restore into the isolated, disposable database and verify.
      # ---------------------------------------------------------------------
      - name: Restore into isolated database and verify
        run: |
          set -o pipefail
          DUMP="$(ls backup-artifacts/*.dump | head -1)"
          # `set -o pipefail` is load-bearing. Without it a pipeline's status is
          # `tee`'s, so a failing verification reported SUCCESS — which is how an
          # earlier run showed "restore passed" while nothing had been restored.
          if ! node scripts/backup/verify-restore.mjs \
              --backup "$DUMP" \
              --label "ci-${{ github.run_id }}" \
              | tee restore-verification.log; then
            echo "::error title=restore verification::$(tail -c 1500 restore-verification.log | tr '\n' ' ')"
            exit 1
          fi
          # Publish the evidence as a notice annotation. Artifact and log
          # storage are not reachable from every environment, but the
          # annotations API always is, so the proof of what was restored stays
          # retrievable instead of living only in a blob that may not resolve.
          evidence="$(grep -h '^\[verify\] OK ' restore-verification.log | tail -1)"
          echo "::notice title=restore evidence::${evidence:-see restore-verification.log}"
        env:
          DATABASE_URL: ${{ env.SOURCE_URL }}
          RESTORE_VERIFY_ADMIN_URL: ${{ env.TARGET_URL }}
          RESTORE_VERIFY_ISOLATION_CONFIRMATION: I_CONFIRMED_A_DISPOSABLE_ISOLATED_TARGET
          RESTORE_VERIFY_ALLOWED_PORT: '5433'

      - name: Encrypted replica survives isolated restore verification
        run: |
          set -euo pipefail
          mkdir -m 700 replica-artifacts recovery-temp
          DUMP="$(realpath "$(ls backup-artifacts/*.dump | head -1)")"
          node scripts/backup/replicate.mjs upload --backup "$DUMP"
          node scripts/backup/replicate.mjs upload --backup "$DUMP" | grep 'already-present'
          node scripts/backup/replicate.mjs recover --name "$(basename "$DUMP")" --temp-dir "$(realpath recovery-temp)" --verify-restore | tee replica-restore.log
          grep -q '"status":"restore-verified"' replica-restore.log
          test -z "$(ls -A recovery-temp)"
          test "$(find replica-artifacts -type f | wc -l)" -eq 1
          if grep -aF 'bkverify-org-0001' replica-artifacts/*.age; then
            echo "ERROR: plaintext fixture found in replica" >&2; exit 1
          fi
        env:
          BACKUP_REPLICATION_DIR: ${{ github.workspace }}/replica-artifacts
          BACKUP_REPLICATION_KEY: ${{ secrets.CI_BACKUP_REPLICATION_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
          DATABASE_URL: ${{ env.SOURCE_URL }}
          RESTORE_VERIFY_ADMIN_URL: ${{ env.TARGET_URL }}
          RESTORE_VERIFY_ISOLATION_CONFIRMATION: I_CONFIRMED_A_DISPOSABLE_ISOLATED_TARGET
          RESTORE_VERIFY_ALLOWED_PORT: '5433'

      # Off-site shipping (Batch 3C-2B). No real provider credentials exist in
      # CI, so an isolated, TLS-terminated S3-compatible server (Versity S3
      # Gateway, a separate implementation that checks SigV4 signatures) with
      # throwaway credentials stands in. Real-provider verification is pending;
      # see docs/operations/backup-offsite-shipping.md.
      - name: Shipped replica is verified, protected from overwrite and restorable
        run: |
          set -euo pipefail
          # Throwaway credentials. The mask command is issued before output is
          # captured, so the secret is not written to the step log file.
          S3_USER="ci$(openssl rand -hex 8)"
          S3_SECRET="$(openssl rand -hex 24)"
          echo "::add-mask::$S3_SECRET"
          exec > >(tee shipping-step.log) 2>&1
          trap 'echo "::error title=off-site shipping::failed near line $LINENO: $(tail -n 6 shipping-step.log | tr "\n" "|" | head -c 1500)"' ERR

          # Pinned release of the Versity S3 Gateway, checked against its
          # published SHA-256 before it is executed.
          curl -fsSL -o s3-gateway.tar.gz "$S3_GATEWAY_URL"
          echo "$S3_GATEWAY_SHA256  s3-gateway.tar.gz" | sha256sum -c -
          mkdir s3-gateway s3-certs s3-data
          tar -xzf s3-gateway.tar.gz -C s3-gateway
          GATEWAY="$(find s3-gateway -type f -name versitygw | head -1)"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -keyout s3-certs/private.key -out s3-certs/public.crt 2>/dev/null
          CA="$PWD/s3-certs/public.crt"
          ROOT_ACCESS_KEY="$S3_USER" ROOT_SECRET_KEY="$S3_SECRET" "$GATEWAY" \
            --port 127.0.0.1:9000 --region us-east-1 \
            --cert "$CA" --key "$PWD/s3-certs/private.key" \
            posix "$PWD/s3-data" > s3-gateway.log 2>&1 &
          S3_PID=$!
          for i in $(seq 1 30); do
            curl -s -o /dev/null --cacert "$CA" https://localhost:9000/ && break
            [ "$i" -lt 30 ] || { tail -20 s3-gateway.log; false; }
            sleep 1
          done

          # Administrative access, used only to create the bucket and to play
          # the part of someone tampering with storage. Never given to ship.mjs
          # children: these variables are scoped to this function.
          s3admin() {
            AWS_ACCESS_KEY_ID="$S3_USER" AWS_SECRET_ACCESS_KEY="$S3_SECRET" \
            AWS_DEFAULT_REGION=us-east-1 AWS_CA_BUNDLE="$CA" AWS_EC2_METADATA_DISABLED=true \
              aws --endpoint-url https://localhost:9000 "$@"
          }
          s3admin s3api create-bucket --bucket "$BUCKET" > /dev/null

          mkdir -m 700 shipping-state
          export BACKUP_SHIPPING_ENDPOINT=https://localhost:9000
          export BACKUP_SHIPPING_REGION=us-east-1
          export BACKUP_SHIPPING_BUCKET="$BUCKET"
          export BACKUP_SHIPPING_PREFIX=ci
          export BACKUP_SHIPPING_ACCESS_KEY_ID="$S3_USER"
          export BACKUP_SHIPPING_SECRET_ACCESS_KEY="$S3_SECRET"
          export BACKUP_SHIPPING_CA_FILE="$CA"
          export BACKUP_SHIPPING_INVENTORY="$PWD/shipping-state/inventory.jsonl"
          export BACKUP_SHIPPING_ATTEMPTS=2

          REPLICA="$(ls replica-artifacts/*.age)"
          NAME="$(basename "$REPLICA" .age)"
          KEY="ci/$NAME.age"
          TEMP="$(realpath recovery-temp)"
          expect_exit() {
            local want="$1"; shift
            set +e; "$@"; local got=$?; set -e
            if [ "$got" -ne "$want" ]; then echo "expected exit $want, got $got: $*"; false; fi
          }

          echo "--- TLS is mandatory"
          expect_exit 3 env BACKUP_SHIPPING_ENDPOINT=http://localhost:9000 \
            node scripts/backup/ship.mjs ship --name "$NAME"
          expect_exit 3 env -u BACKUP_SHIPPING_CA_FILE \
            node scripts/backup/ship.mjs ship --name "$NAME"

          echo "--- ship, then retry"
          node scripts/backup/ship.mjs ship --name "$NAME" | tee ship.log
          grep -q '"status":"uploaded"' ship.log
          node scripts/backup/ship.mjs ship --name "$NAME" | grep -q '"status":"already-present"'

          echo "--- independent read: the stored object is the local ciphertext, not plaintext"
          s3admin s3api get-object --bucket "$BUCKET" --key "$KEY" remote.age > /dev/null
          cmp remote.age "$REPLICA"
          if grep -aqF 'bkverify-org-0001' remote.age; then echo "plaintext in object"; false; fi
          test "$(s3admin s3api list-objects-v2 --bucket "$BUCKET" --query 'length(Contents)')" = "1"

          echo "--- the store itself refuses a second create of the same key"
          expect_exit 254 s3admin s3api put-object --bucket "$BUCKET" --key "$KEY" \
            --body remote.age --if-none-match '*' 2> conditional.log
          cat conditional.log
          grep -q PreconditionFailed conditional.log

          echo "--- inventory"
          node scripts/backup/ship.mjs verify --name "$NAME"
          node scripts/backup/ship.mjs inventory | tee inventory.log
          HEAD="$(sed -n 's/.*"head":"\([0-9a-f]\{64\}\)".*/\1/p' inventory.log)"
          node scripts/backup/ship.mjs inventory --anchor "$HEAD"
          grep -q "\"sha256\":\"$(sha256sum "$REPLICA" | cut -d' ' -f1)\"" shipping-state/inventory.jsonl

          echo "--- recovery from the bucket alone, into the isolated PostgreSQL target"
          mv "$REPLICA" held-replica.age
          node scripts/backup/ship.mjs recover --name "$NAME" --temp-dir "$TEMP" --verify-restore \
            | tee shipped-restore.log
          grep -q '"status":"restore-verified"' shipped-restore.log
          grep -q '\[verify\] restored' shipped-restore.log
          test -z "$(ls -A recovery-temp)"

          echo "--- wrong key and wrong key version"
          expect_exit 3 env BACKUP_REPLICATION_KEY="$(printf 'f%.0s' $(seq 64))" \
            node scripts/backup/ship.mjs recover --name "$NAME" --temp-dir "$TEMP"
          expect_exit 3 env BACKUP_REPLICATION_KEY_ID=ci-key-other \
            node scripts/backup/ship.mjs recover --name "$NAME" --temp-dir "$TEMP"
          test -z "$(ls -A recovery-temp)"
          mv held-replica.age "$REPLICA"

          echo "--- a tampered remote object is detected and never overwritten"
          cp remote.age tampered.age
          printf 'XXXXXXXX' | dd of=tampered.age bs=1 seek=4096 conv=notrunc status=none
          s3admin s3api put-object --bucket "$BUCKET" --key "$KEY" --body tampered.age > /dev/null
          expect_exit 4 node scripts/backup/ship.mjs verify --name "$NAME"
          expect_exit 4 node scripts/backup/ship.mjs recover --name "$NAME" --temp-dir "$TEMP" --verify-restore
          expect_exit 4 node scripts/backup/ship.mjs ship --name "$NAME"
          s3admin s3api get-object --bucket "$BUCKET" --key "$KEY" after.age > /dev/null
          cmp after.age tampered.age
          test -z "$(ls -A recovery-temp)"
          tail -n 1 shipping-state/inventory.jsonl | grep -q '"status":"failed"'
          node scripts/backup/ship.mjs inventory --anchor "$HEAD"

          echo "--- no storage credential in any output or the inventory"
          kill "$S3_PID"
          sleep 1
          if grep -qF -e "$S3_SECRET" -e "$S3_USER" shipping-step.log ship.log inventory.log \
               shipped-restore.log conditional.log shipping-state/inventory.jsonl; then
            echo "storage credential found in output"; false
          fi
          echo "Off-site shipping verified against an isolated S3-compatible service"
        env:
          S3_GATEWAY_URL: https://github.com/versity/versitygw/releases/download/v1.11.0/versitygw_v1.11.0_Linux_x86_64.tar.gz
          S3_GATEWAY_SHA256: 1f075c9dc92fef232f5b3c7465711ddc5e1b062b2b6df4a3bd246a4be5b35b52
          BUCKET: agencyos-ci-backups
          BACKUP_REPLICATION_DIR: ${{ github.workspace }}/replica-artifacts
          BACKUP_REPLICATION_KEY: ${{ secrets.CI_BACKUP_REPLICATION_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
          BACKUP_REPLICATION_KEY_ID: ci-key-1
          DATABASE_URL: ${{ env.SOURCE_URL }}
          RESTORE_VERIFY_ADMIN_URL: ${{ env.TARGET_URL }}
          RESTORE_VERIFY_ISOLATION_CONFIRMATION: I_CONFIRMED_A_DISPOSABLE_ISOLATED_TARGET
          RESTORE_VERIFY_ALLOWED_PORT: '5433'

      # ---------------------------------------------------------------------
      # 3. Independent proof. The script above could in principle verify itself
      #    incorrectly, so this step queries the restored rows directly with
      #    psql and compares them to the source. It runs its own restore into a
      #    second disposable database that it keeps, so the rows are real.
      # ---------------------------------------------------------------------
      - name: Query the restored data independently
        run: |
          set -euo pipefail

          # The verification step above could in principle be wrong about its
          # own success, so this step looks at the restored rows with psql and
          # nothing else. It asks verify-restore.mjs for a `--keep` run, which
          # reuses the restore path already proven in the previous step rather
          # than re-implementing CREATE DATABASE / pg_restore / DROP here.
          DUMP="$(ls backup-artifacts/*.dump | head -1)"
          node scripts/backup/verify-restore.mjs --backup "$DUMP" --keep \
            > keep-restore.log 2>&1 || {
            echo "::error title=restore verification::--keep restore failed: $(tail -c 1200 keep-restore.log | tr '\n' ' ')"
            exit 1
          }
          cat keep-restore.log

          DB="$(sed -n 's/^\[verify\] kept *\([^ ]*\).*/\1/p' keep-restore.log | tail -1)"
          if [ -z "$DB" ]; then
            echo "::error title=restore verification::could not determine the kept database name"
            exit 1
          fi
          echo "Inspecting kept database: $DB"

          # Discrete PG* env: the password is never an argument of psql.
          export PGHOST=localhost PGPORT=5433 PGUSER=agencyos PGPASSWORD="$TARGET_PASSWORD"

          # -A -t -F'|' so the output is exactly `name|count`, with no heading
          # or "(N rows)" footer to parse around.
          psql -w -At -F'|' -v ON_ERROR_STOP=1 -d "$DB" -c "
            SELECT 'Organization'::text, count(*) FROM \"Organization\" WHERE id = 'bkverify-org-0001'
            UNION ALL SELECT 'Role', count(*) FROM \"Role\" WHERE id = 'bkverify-role-0001'
            UNION ALL SELECT 'User', count(*) FROM \"User\" WHERE id = 'bkverify-user-0001'
            UNION ALL SELECT 'Session', count(*) FROM \"Session\" WHERE id = 'bkverify-session-0001'
            UNION ALL SELECT 'RateLimitBucket', count(*) FROM \"RateLimitBucket\" WHERE key LIKE 'bkverify:bucket:%'
            UNION ALL SELECT '_prisma_migrations', count(*) FROM \"_prisma_migrations\" WHERE finished_at IS NOT NULL;" \
            > restored-rows.txt 2>&1 || {
            echo "::error title=restore verification::query failed: $(tail -c 1200 restored-rows.txt | tr '\n' ' ')"
            exit 1
          }
          echo "--- restored fixture rows ---"
          cat restored-rows.txt

          check() {
            local name="$1" want="$2"
            local got
            got="$(awk -F'|' -v n="$name" '$1==n {print $2}' restored-rows.txt | tr -d ' \r')"
            if [ "$got" != "$want" ]; then
              echo "::error title=restore verification::$name has '$got' row(s) after restore, expected '$want'. Counts: $(tr '\n' ' ' < restored-rows.txt)"
              return 1
            fi
            echo "  $name: $got (expected $want)"
          }

          check Organization 1
          check Role 1
          check User 1
          check Session 1
          check RateLimitBucket 2

          migrations="$(awk -F'|' '$1=="_prisma_migrations" {print $2}' restored-rows.txt | tr -d ' \r')"
          if [ -z "$migrations" ] || [ "$migrations" -lt 19 ]; then
            echo "::error title=restore verification::migration history has '$migrations' rows, expected >= 19"
            exit 1
          fi
          echo "  _prisma_migrations: $migrations"

          # Row counts alone would pass on an archive whose foreign keys were
          # dropped, so this asserts the relationship survived with the data.
          joins="$(psql -w -At -v ON_ERROR_STOP=1 -d "$DB" -c "
            SELECT count(*) FROM \"Session\" s
            JOIN \"User\" u ON u.id = s.\"userId\"
            JOIN \"Organization\" o ON o.id = u.\"organizationId\"
            WHERE s.id = 'bkverify-session-0001'
              AND u.id = 'bkverify-user-0001'
              AND o.id = 'bkverify-org-0001';" 2>&1)" || {
            echo "::error title=restore verification::join query failed: $joins"
            exit 1
          }
          echo "Restored session -> user -> organization join rows: $joins"
          if [ "$joins" != "1" ]; then
            echo "::error title=restore verification::the restored session no longer joins to its user and organization (got '$joins')"
            exit 1
          fi

          # Drop only the database this step inspected, re-checking the prefix.
          case "$DB" in
            agencyos_restore_verify_*) psql -w -q -d postgres -c "DROP DATABASE \"$DB\";" ;;
            *) echo "::error title=restore verification::refusing to drop '$DB' (no disposable prefix)"; exit 1 ;;
          esac
          echo "Independent verification passed: fixture rows, migrations and foreign keys intact"
        env:
          TARGET_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}
          # `--keep` still goes through every guard, so it needs the same
          # isolated-target declaration the verification step used.
          DATABASE_URL: ${{ env.SOURCE_URL }}
          RESTORE_VERIFY_ADMIN_URL: ${{ env.TARGET_URL }}
          RESTORE_VERIFY_ISOLATION_CONFIRMATION: I_CONFIRMED_A_DISPOSABLE_ISOLATED_TARGET
          RESTORE_VERIFY_ALLOWED_PORT: '5433'

      # ---------------------------------------------------------------------
      # 4. Failure paths. A verifier that only ever sees success is untested.
      # ---------------------------------------------------------------------
      - name: Corrupted archive is rejected before any restore
        run: |
          set -euo pipefail
          DUMP="$(ls backup-artifacts/*.dump | head -1)"
          CORRUPT="backup-artifacts/corrupted.dump"
          cp "$DUMP" "$CORRUPT"
          cp "$DUMP.json" "$CORRUPT.json"
          # Flip bytes in the middle: still a file, no longer a valid archive.
          printf 'XXXXXXXX' | dd of="$CORRUPT" bs=1 seek=2048 conv=notrunc status=none
          set +e
          node scripts/backup/verify-restore.mjs --backup "$CORRUPT" > corrupt.log 2>&1
          status=$?
          set -e
          cat corrupt.log
          if [ "$status" -ne 4 ]; then
            echo "ERROR: expected exit 4 (integrity), got $status" >&2
            exit 1
          fi
          grep -qi "checksum mismatch" corrupt.log
          echo "Corrupted archive correctly rejected with exit 4"
        env:
          DATABASE_URL: ${{ env.SOURCE_URL }}
          RESTORE_VERIFY_ADMIN_URL: ${{ env.TARGET_URL }}
          RESTORE_VERIFY_ISOLATION_CONFIRMATION: I_CONFIRMED_A_DISPOSABLE_ISOLATED_TARGET
          RESTORE_VERIFY_ALLOWED_PORT: '5433'

      - name: Restore refuses a non-disposable target
        run: |
          set -uo pipefail
          DUMP="$(ls backup-artifacts/*.dump | head -1)"

          fail() {
            echo "::error title=refusal matrix::$1"
            if [ -f refusal.log ]; then echo "--- last output ---"; tail -20 refusal.log; fi
            exit 1
          }

          check_refused() {
            local label="$1"; shift
            : > refusal.log
            set +e
            "$@" > refusal.log 2>&1
            local status=$?
            set -e
            cat refusal.log
            if [ "$status" -ne 2 ]; then
              fail "$label — expected exit 2 (unsafe), got $status"
            fi
            echo "$label -> refused correctly"
          }

          # 1. No confirmation string: the operator never declared the target
          #    disposable.
          check_refused "missing confirmation" env -u RESTORE_VERIFY_ISOLATION_CONFIRMATION \
            node scripts/backup/verify-restore.mjs --backup "$DUMP"

          # 2. Pointed at the application database: the exact mistake the guard
          #    exists to stop. The name is explicitly the live one, so the
          #    "target is DATABASE_URL" branch is genuinely reached.
          check_refused "application database as target" env \
            RESTORE_VERIFY_ADMIN_URL="$DATABASE_URL" \
            RESTORE_VERIFY_ISOLATION_CONFIRMATION=I_CONFIRMED_A_DISPOSABLE_ISOLATED_TARGET \
            node scripts/backup/verify-restore.mjs --backup "$DUMP" \
              --target-database agencyos

          # 3. Isolated server, but not the approved port.
          check_refused "wrong isolated port" env \
            RESTORE_VERIFY_ALLOWED_PORT=5499 \
            node scripts/backup/verify-restore.mjs --backup "$DUMP"

          # The application database must be untouched by all of the above.
          # PG* in this step's env point at the SOURCE service on 5432.
          here="$(psql -w -q -At -v ON_ERROR_STOP=1 -c 'SELECT current_database();' 2>&1)" \
            || fail "could not query the source database: $here"
          echo "connected to: $here"
          [ "$here" = "agencyos" ] || fail "this check is not pointed at the source database (got '$here')"

          rows="$(psql -w -q -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM "Organization";' 2>&1)" \
            || fail "could not count source rows: $rows"
          echo "Organization rows still in the source database: $rows"
          [ "$rows" -ge 1 ] || fail "source database lost its data (Organization rows = $rows)"
        env:
          DATABASE_URL: ${{ env.SOURCE_URL }}
          RESTORE_VERIFY_ADMIN_URL: ${{ env.TARGET_URL }}
          RESTORE_VERIFY_ISOLATION_CONFIRMATION: I_CONFIRMED_A_DISPOSABLE_ISOLATED_TARGET
          RESTORE_VERIFY_ALLOWED_PORT: '5433'
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: agencyos
          PGDATABASE: agencyos
          PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}

      # ---------------------------------------------------------------------
      # 5. Nothing sensitive in the logs.
      # ---------------------------------------------------------------------
      - name: Backup output contains no credentials
        run: |
          set -euo pipefail
          PASSWORD="${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}"
          for f in restore-verification.log restored-rows.txt corrupt.log backup-artifacts/*.json \
                   shipping-step.log shipping-state/inventory.jsonl \
                   scheduled-artifacts/*.json retention.log retention-dry-run.log overlap.log failed-backup.log; do
            [ -f "$f" ] || continue
            if grep -qF "$PASSWORD" "$f"; then
              echo "ERROR: credential material found in $f" >&2
              exit 1
            fi
            if grep -qE 'postgresql://[^:]+:[^*@]' "$f"; then
              echo "ERROR: unredacted connection URL found in $f" >&2
              exit 1
            fi
          done
          echo "No credentials in any backup/restore output"

      - name: Upload backup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-verify-evidence
          path: |
            backup-artifacts/*.json
            scheduled-artifacts/*.json
            restore-verification.log
            restored-rows.txt
            retention.log
            shipping-step.log
            shipping-state/inventory.jsonl
          if-no-files-found: ignore
          retention-days: 7
