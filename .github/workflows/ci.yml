name: CI

on:
  push:
    branches: [main, arena/**, feature/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agencyos
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}
          POSTGRES_DB: agencyos
        options: >-
          --health-cmd "pg_isready -U agencyos -d agencyos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      # Generate the Prisma client before typechecking: without it @prisma/client
      # resolves to a missing module and skipLibCheck silently makes every
      # Prisma call `any`, which hides schema/code drift from tsc.
      - run: node_modules/.bin/prisma generate
        env:
          CHECKPOINT_DISABLE: "1"
          PRISMA_HIDE_UPDATE_MESSAGE: "true"
      - run: npx tsc --noEmit
      # Prisma client is typed `any` in lib/db.ts, so tsc cannot catch writes to
      # columns that do not exist. This guard statically compares every Prisma
      # write payload against prisma/schema.prisma.
      - run: npm run check:schema

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agencyos
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}
          POSTGRES_DB: agencyos
        options: >-
          --health-cmd "pg_isready -U agencyos -d agencyos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      - run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U agencyos -d agencyos; then
              echo "Database is ready"
              break
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done
      - run: node_modules/.bin/prisma generate
        env:
          CHECKPOINT_DISABLE: "1"
          PRISMA_HIDE_UPDATE_MESSAGE: "true"
          DATABASE_URL: "postgresql://agencyos:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}@localhost:5432/agencyos?schema=public"
      - run: node_modules/.bin/prisma validate
        env:
          CHECKPOINT_DISABLE: "1"
          PRISMA_HIDE_UPDATE_MESSAGE: "true"
          DATABASE_URL: "postgresql://agencyos:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}@localhost:5432/agencyos?schema=public" 
      - run: set -o pipefail && node_modules/.bin/prisma migrate deploy 2>&1
        env:
          CHECKPOINT_DISABLE: "1"
          PRISMA_HIDE_UPDATE_MESSAGE: "true"
          DATABASE_URL: "postgresql://agencyos:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}@localhost:5432/agencyos?schema=public"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: prisma-migrate-log
          path: prisma-migrate.log
      - run: |
          npm run build > build-output.log 2>&1 &
          BUILD_PID=$!
          wait $BUILD_PID
          BUILD_EXIT=$?
          tail -n 80 build-output.log
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "ERROR: Next.js build failed" >&2
            exit 1
          fi
          npm start > server-output.log 2>&1 &
          SERVER_PID=$!
          SERVER_READY=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/auth/get-session > /dev/null 2>&1; then
              echo "Next.js server is ready"
              SERVER_READY=1
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          if [ "$SERVER_READY" -ne 1 ]; then
            echo "ERROR: Next.js server did not become ready within 60 seconds" >&2
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          set -o pipefail && npm run test:unit 2>&1 | tee unit-test-output.log
          UNIT_EXIT=$?
          set -o pipefail && npm run test:integration 2>&1 | tee integration-test-output.log
          INTEGRATION_EXIT=$?
          kill $SERVER_PID 2>/dev/null || true
          if [ "$UNIT_EXIT" -ne 0 ] || [ "$INTEGRATION_EXIT" -ne 0 ]; then
            echo "ERROR: tests failed (unit=$UNIT_EXIT integration=$INTEGRATION_EXIT)" >&2
            exit 1
          fi
        env:
          DATABASE_URL: "postgresql://agencyos:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}@localhost:5432/agencyos?schema=public"
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci_auth_secret_arena_2026' }}
          BETTER_AUTH_URL: "http://localhost:3001"
          TEST_SERVER_URL: "http://localhost:3001"
          NODE_ENV: "test"
          PORT: "3001"
          # The integration runner drives hundreds of requests from 127.0.0.1.
          # Trusting the forwarding header here (the runner is the only client,
          # and it is what sets the header) lets each suite claim its own
          # private bucket and exercise the per-address limits without
          # exhausting the shared one. Production does not set this unless a
          # real trusted proxy rewrites the header.
          TRUST_PROXY_HEADERS: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-output-logs
          path: |
            unit-test-output.log
            integration-test-output.log
          if-no-files-found: ignore
      # Logs and artifacts live on a storage host that is not reachable from
      # every environment; annotations are always available through the API, so
      # the interesting failure lines are surfaced here as well.
      - name: Surfaces test failures as annotations
        if: failure()
        run: |
          echo "## Test failure details" >> "$GITHUB_STEP_SUMMARY"
          for f in build-output.log server-output.log unit-test-output.log integration-test-output.log; do
            [ -f "$f" ] || continue
            {
              echo ""
              echo "### $f"
              echo '```'
              grep -aE "FAIL |AssertionError|Expected|Received|❯ |Test Files|Tests +[0-9]|Error:" "$f" | sed -e 's/\x1b\[[0-9;]*m//g' | tail -120
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          for f in build-output.log server-output.log unit-test-output.log integration-test-output.log; do
            [ -f "$f" ] || continue
            tail -n 40 "$f" | sed -e 's/\x1b\[[0-9;]*m//g' | tr '\n' '|' | head -c 5000 > /tmp/tail.txt || true
            echo "::error file=.github/workflows/ci.yml,title=tail $f::$(cat /tmp/tail.txt)"
          done

  e2e:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agencyos
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}
          POSTGRES_DB: agencyos
        options: >-
          --health-cmd "pg_isready -U agencyos -d agencyos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U agencyos -d agencyos; then
              echo "Database is ready"
              break
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done
      - run: node_modules/.bin/prisma generate
        env:
          CHECKPOINT_DISABLE: "1"
          PRISMA_HIDE_UPDATE_MESSAGE: "true"
          DATABASE_URL: "postgresql://agencyos:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}@localhost:5432/agencyos?schema=public"
      - run: node_modules/.bin/prisma migrate deploy
        env:
          CHECKPOINT_DISABLE: "1"
          PRISMA_HIDE_UPDATE_MESSAGE: "true"
          DATABASE_URL: "postgresql://agencyos:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}@localhost:5432/agencyos?schema=public"
      - name: Record Playwright runner and browser metadata
        run: |
          {
            echo "--- Runner OS ---"
            cat /etc/os-release
            echo "--- Node and package versions ---"
            node --version
            npm --version
            node - <<'NODE'
          for (const name of ['@playwright/test', 'playwright', 'playwright-core']) {
            try {
              const pkg = require(`./node_modules/${name}/package.json`);
              console.log(`${name}: ${pkg.version}`);
            } catch (error) {
              console.log(`${name}: unavailable (${error.message})`);
            }
          }
          const browserData = require('./node_modules/playwright-core/browsers.json');
          console.log('managed Chromium:', browserData.browsers.filter(({ name }) => name.startsWith('chromium')));
          NODE
          } 2>&1 | tee playwright-runner-info.log
      - name: Install Playwright Chromium and system dependencies
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium 2>&1 | tee playwright-install.log
      - run: npm run build
        env:
          DATABASE_URL: "postgresql://agencyos:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}@localhost:5432/agencyos?schema=public"
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci_auth_secret_arena_2026' }}
          BETTER_AUTH_URL: "http://localhost:3001"
      - name: Run Playwright against an isolated test database
        run: |
          npm start > e2e-server-output.log 2>&1 &
          SERVER_PID=$!
          SERVER_READY=0
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3001/api/auth/get-session > /dev/null 2>&1; then
              echo "Next.js server is ready"
              SERVER_READY=1
              break
            fi
            echo "Waiting for server... ($i/40)"
            sleep 2
          done
          if [ "$SERVER_READY" -ne 1 ]; then
            echo "ERROR: Next.js server did not become ready" >&2
            tail -n 80 e2e-server-output.log
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          set -o pipefail && npx playwright test --add-reporter=json 2>&1 | tee e2e-output.log
          E2E_EXIT=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $E2E_EXIT
        env:
          DATABASE_URL: "postgresql://agencyos:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}@localhost:5432/agencyos?schema=public"
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci_auth_secret_arena_2026' }}
          BETTER_AUTH_URL: "http://localhost:3001"
          APP_URL: "http://localhost:3001"
          TEST_SERVER_URL: "http://localhost:3001"
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          PLAYWRIGHT_JSON_OUTPUT_FILE: "playwright-results.json"
          CI: "true"
          PORT: "3001"
      - name: Report exact Playwright result counts
        if: always()
        run: |
          if [ ! -f playwright-results.json ]; then
            echo "Playwright did not produce a JSON report; browser tests did not start." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Playwright result counts::not run (no JSON report)"
            exit 0
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('playwright-results.json', 'utf8'));
          let retriedTests = 0;
          let retryAttempts = 0;
          const visit = (suites) => {
            for (const suite of suites ?? []) {
              for (const spec of suite.specs ?? []) {
                for (const test of spec.tests ?? []) {
                  const retries = (test.results ?? []).filter((result) => result.retry > 0).length;
                  if (retries > 0) retriedTests += 1;
                  retryAttempts += retries;
                }
              }
              visit(suite.suites);
            }
          };
          visit(report.suites);
          const stats = report.stats ?? {};
          const summary = `passed=${stats.expected ?? 0}, failed=${stats.unexpected ?? 0}, skipped=${stats.skipped ?? 0}, flaky=${stats.flaky ?? 0}, retried_tests=${retriedTests}, retry_attempts=${retryAttempts}`;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Playwright result counts\n\n${summary}\n`);
          console.log(`::notice title=Playwright result counts::${summary}`);
          NODE
      - name: Surface E2E failures
        if: failure()
        run: |
          echo "## E2E failure diagnostics" >> "$GITHUB_STEP_SUMMARY"
          for f in playwright-runner-info.log playwright-install.log e2e-output.log e2e-server-output.log; do
            [ -f "$f" ] || continue
            {
              echo ""
              echo "### $f (last 80 lines)"
              echo '```text'
              tail -n 80 "$f" | sed -e 's/\x1b\[[0-9;]*m//g'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            diagnostic=$(tail -n 50 "$f" | sed -e 's/\x1b\[[0-9;]*m//g' | tr '\n' '|' | head -c 6000)
            echo "::error file=.github/workflows/ci.yml,title=$f::$diagnostic"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            playwright-runner-info.log
            playwright-install.log
            playwright-results.json
            e2e-output.log
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
        env:
          DATABASE_URL: "postgresql://agencyos:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_arena_test_2026' }}@localhost:5432/agencyos?schema=public"
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci_auth_secret_arena_2026' }}
          BETTER_AUTH_URL: "http://localhost:3001"
