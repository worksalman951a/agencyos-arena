# AgencyOS — A Agent Local Preview (Phase 0 + Phase 1)
# No cloud resources are provisioned. All services run locally.
#
# Ports are configurable via environment variables (see .env.example).
# CI and local development both serve the app on port 3001. Port 3000 is reserved for a different project.
#
# To start:   docker compose -p agencyos-a up
# To stop:    docker compose -p agencyos-a down
# To reset DB: docker compose -p agencyos-a down -v && docker compose -p agencyos-a up

name: agencyos-a

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agencyos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ci_arena_test_2026}
      POSTGRES_DB: agencyos
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:${POSTGRES_INTERNAL_PORT:-5432}"
    volumes:
      - agencyos_a_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agencyos -d agencyos"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://agencyos:${POSTGRES_PASSWORD:-ci_arena_test_2026}@postgres:${POSTGRES_INTERNAL_PORT:-5432}/agencyos?schema=public"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-ci_nextauth_secret_arena_2026}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-ci_better_auth_secret_arena_2026}
      BETTER_AUTH_URL: "http://localhost:${APP_PORT:-3001}"
      NODE_ENV: "development"
      PORT: "${APP_PORT:-3001}"
    ports:
      - "${APP_PORT:-3001}:${APP_PORT:-3001}"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

volumes:
  agencyos_a_postgres_data:
